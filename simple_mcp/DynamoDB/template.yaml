AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Resources:
  # Table 1: Instance details with simple key
  OncallInstancesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: oncall-instances
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: instance_id
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: updated_at
          AttributeType: S
      KeySchema:
        - AttributeName: instance_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: StatusIndex
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: updated_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Environment
          Value: Production
        - Key: Purpose
          Value: Terminal MCP Instances

  # Table 2: Chat messages with simple key structure
  OncallMessagesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: oncall-messages
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: instance_id
          AttributeType: S
        - AttributeName: message_id
          AttributeType: S
        - AttributeName: message_order
          AttributeType: N
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: instance_id
          KeyType: HASH
        - AttributeName: message_id
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: MessageOrderIndex
          KeySchema:
            - AttributeName: instance_id
              KeyType: HASH
            - AttributeName: message_order
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: TimestampIndex
          KeySchema:
            - AttributeName: instance_id
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Environment
          Value: Production
        - Key: Purpose
          Value: Terminal MCP Messages

